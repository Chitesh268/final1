/* MONARCH ENGINE: black glass, travelling lightning, level-reactive aura */

.top,.card,.status-screen,.attr-tile,.metric{border-color:color-mix(in srgb,var(--energy) 43%,#090b10);}
.top,.status-screen,.card{isolation:isolate}

.top:after{border-color:color-mix(in srgb,var(--energy) 20%,transparent);box-shadow:0 0 0 20px color-mix(in srgb,var(--energy) 5%,transparent),0 0 0 40px color-mix(in srgb,var(--energy) 3%,transparent)}
.status-screen{background:linear-gradient(135deg,#020306,#090d15 65%,#020306);box-shadow:0 0 25px color-mix(in srgb,var(--energy) 12%,transparent),inset 0 0 30px color-mix(in srgb,var(--energy) 4%,transparent)}
.level-orb{border-color:var(--energy);background:radial-gradient(circle,color-mix(in srgb,var(--energy) 23%,#06070a) 0,#020306 70%);box-shadow:0 0 24px color-mix(in srgb,var(--energy) 40%,transparent),inset 0 0 24px color-mix(in srgb,var(--energy) 20%,transparent);animation:orbPulse 2.6s ease-in-out infinite}

  if(now<scrollingUntil){scrollPaused=true;return} if(scrollPaused){scrollPaused=false;particles=[]}
  const panels=[...document.querySelectorAll('.top,.card,.status-screen,.attr-tile,.metric,.body-training')].filter(el=>el.getClientRects().length).slice(0,14);
  const energy=getComputedStyle(document.body).getPropertyValue('--energy').trim()||'#42caff';
  panels.forEach((el,idx)=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||r.right<0||r.left>innerWidth||r.width<18||r.height<18)return;
   const x=r.left+1,y=r.top+1,w=r.width-2,h=r.height-2,per=2*(w+h);if(per<80)return;
   // Calm continuous aura: soft full perimeter plus one long, slowly circulating luminous wave.
   ctx.save();ctx.shadowColor=energy;ctx.shadowBlur=7;ctx.strokeStyle=energy;ctx.globalAlpha=.16;ctx.lineWidth=1.4;ctx.strokeRect(x,y,w,h);ctx.restore();
   const phase=(now*.012+idx*83)%per;const waveLen=Math.min(per*.44,Math.max(90,per*.22));
   for(let layer=0;layer<3;layer++){ctx.beginPath();let steps=24;for(let i=0;i<=steps;i++){let q=(phase+waveLen*i/steps+layer*per/3)%per,[px,py]=pointOnRect({left:x,top:y,right:x+w,bottom:y+h,width:w,height:h},q);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.strokeStyle=layer===0?'rgba(255,255,255,.72)':energy;ctx.lineWidth=layer===0?1.1:layer===1?2.5:5;ctx.globalAlpha=layer===0?.45:layer===1?.22:.07;ctx.shadowColor=energy;ctx.shadowBlur=layer===0?6:11;ctx.stroke()}
   // Tiny dust motes drift gently along the border; no branches, jagged arcs or random explosive flashes.
   if(particles.length<40&&Math.random()<.025)particles.push({id:idx,q:Math.random()*per,speed:rand(.06,.18),life:rand(100,220),age:0,size:rand(.6,1.5)});
  });
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.age++;const el=panels[p.id],r=el?.getBoundingClientRect();if(!r||p.age>p.life){particles.splice(i,1);continue}p.q+=p.speed*3;const [px,py]=pointOnRect(r,p.q);const fade=Math.sin(Math.PI*p.age/p.life)*.38;ctx.beginPath();ctx.arc(px,py,p.size,0,Math.PI*2);ctx.fillStyle='rgba(210,225,255,'+fade+')';ctx.shadowColor=getComputedStyle(document.body).getPropertyValue('--energy');ctx.shadowBlur=5;ctx.fill();ctx.shadowBlur=0}
 }
 fxFrame=requestAnimationFrame(frame);
}

 let wd=document.querySelector('#workout-done');if(wd)wd.onclick=()=>{sfx('claim');systemAlert('WORKOUT OPTION LOGGED','You selected: '+(document.querySelector('#workout-choice')?.value||'Workout')+'. Use this as an optional routine and scale it to your ability.','BONUS TRAINING RECORDED')};
 let br=document.querySelector('#body-reset');if(br)br.onclick=()=>{if(confirm('Clear today’s body-training checks?')){S.bodyTasks[today()]=[];if(S.quests[today()])S.quests[today()]=S.quests[today()].filter(x=>x!=='body');save();render()}};
 let pc=document.querySelector('#penalty-confirm'),pr=document.querySelector('#resolve-penalty');if(pc&&pr)pc.onchange=()=>{pr.disabled=!pc.checked};if(pr)pr.onclick=()=>{if(pc?.checked)resolvePenalty()};
 document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render();sfx('tap')});
 document.querySelectorAll('[data-quest]').forEach(el=>el.onchange=()=>{if(el.dataset.quest==='body'&&el.checked&&!bodyComplete()){el.checked=false;toast('COMPLETE THE BODY TRAINING BASELINE FIRST');sfx('penalty');return}let arr=checked();S.quests[today()]=el.checked?[...new Set([...arr,el.dataset.quest])]:arr.filter(x=>x!==el.dataset.quest);save();render();sfx('quest')});
 let c=document.querySelector('#claim');if(c)c.onclick=()=>{if(activePenalty()){toast('XP CLAIMS PAUSED · COMPLETE THE PENALTY PROTOCOL');return}let selected=QUESTS.filter(q=>checked().includes(q.id)&&!rewarded().includes(q.id));if(!selected.length)return;let amount=selected.reduce((a,q)=>a+q.xp,0),oldLevel=lv();S.xp+=amount;S.questRewards=S.questRewards||{};S.questRewards[today()]=[...new Set([...rewarded(),...selected.map(q=>q.id)])];S.claimed=[...new Set([...(S.claimed||[]),today()])];S.claimHistory=[...new Set([...(S.claimHistory||[]),today()])];save();render();sfx(lv()>oldLevel?'level':'claim');if(lv()>oldLevel)systemAlert('LEVEL UP!','Quest rewards increased your Hunter Level. Three stat points are now available to allocate.','LEVEL '+oldLevel+'  →  LEVEL '+lv()+'  ·  +3 STAT POINTS');else systemAlert('QUEST REWARDS ACQUIRED','XP awarded for '+selected.length+' quest'+(selected.length===1?'':'s')+'. Other unclaimed quests remain available.','+'+amount+' XP ACQUIRED')};
 let clear=document.querySelector('#clearchecks');if(clear)clear.onclick=()=>{S.quests[today()]=checked().filter(id=>rewarded().includes(id));save();render()};
 document.querySelectorAll('[data-alloc]').forEach(b=>b.onclick=()=>{if(left()>0){S.stats[b.dataset.alloc]=(S.stats[b.dataset.alloc]||0)+1;save();render()}});
 document.querySelectorAll('[data-skill]').forEach(el=>el.onchange=()=>{if(activePenalty()){el.checked=S.skills.includes(el.dataset.skill);return}S.skills=el.checked?[...new Set([...S.skills,el.dataset.skill])]:S.skills.filter(x=>x!==el.dataset.skill);save();render()});
 let bs=document.querySelector('#bossselect');if(bs)bs.onchange=()=>{S.boss.name=bs.value;S.boss.done=false;save();render()};
 let bd=document.querySelector('#bossdone');if(bd)bd.onchange=()=>{if(activePenalty()){bd.checked=!!S.boss.done;return}S.boss.done=bd.checked;save();render()};
 let bc=document.querySelector('#bossclaim');if(bc)bc.onclick=()=>{if(activePenalty()){toast('XP REWARDS PAUSED DURING PENALTY');return}if(S.boss.done&&S.boss.claimedWeek!==weekKey()){let oldLevel=lv();S.xp+=25;S.boss.claimedWeek=weekKey();save();render();sfx(lv()>oldLevel?'level':'claim');if(lv()>oldLevel)systemAlert('LEVEL UP!','The weekly boss reward pushed your level higher. Three stat points are now available.','LEVEL '+oldLevel+'  →  LEVEL '+lv());else systemAlert('BOSS DEFEATED','You completed your weekly real-life challenge. Your record has been updated.','+25 XP ACQUIRED')}};
 let sj=document.querySelector('#savejournal');if(sj)sj.onclick=()=>{let text=document.querySelector('#journaltext').value.trim();if(text){S.journal.push({id:Date.now().toString(),date:today(),text});save();render();toast('JOURNAL ENTRY SAVED')}};
 let ej=document.querySelector('#exportjournal');if(ej)ej.onclick=()=>download('solo-system-journal.txt',S.journal.map(j=>j.date+'\n'+j.text).join('\n\n'),'text/plain');
 document.querySelectorAll('[data-deljournal]').forEach(b=>b.onclick=()=>{S.journal=S.journal.filter(j=>j.id!==b.dataset.deljournal);save();render()});
 let ex=document.querySelector('#exportbackup');if(ex)ex.onclick=()=>download('solo-system-backup.json',JSON.stringify(S,null,2),'application/json');
 let im=document.querySelector('#importbackup');if(im)im.onchange=async()=>{if(!im.files[0])return;try{let x=JSON.parse(await im.files[0].text());if(typeof x.xp!=='number'||!x.stats||!x.quests)throw Error('invalid');S={...fresh(),...x};save();render();toast('BACKUP IMPORTED')}catch(e){alert('This backup file is not valid.')}}; 
 let st=document.querySelector('#sound-toggle');if(st)st.onchange=()=>{S.soundOn=st.checked;save();if(S.soundOn){sfx('open');toast('SYSTEM AUDIO ENABLED')}};let ts=document.querySelector('#test-sound');if(ts)ts.onclick=()=>{S.soundOn=true;if(st)st.checked=true;save();sfx('alert');toast('ALERT SOUND · alert.mp3')};
 let f=document.querySelector('#focus');if(f)f.onchange=()=>{S.focus=f.value;save();render()};
 let rl=document.querySelector('#reset-level');if(rl)rl.onclick=levelResetWarning;let r=document.querySelector('#reset');if(r)r.onclick=()=>{systemAlert('TOTAL PURGE WARNING','This will erase XP, attributes, quests, journal, achievements and all locally saved player data. Export a backup before continuing.','SECOND CONFIRMATION REQUIRED');setTimeout(()=>{const root=document.querySelector('#alert-root');const btn=document.createElement('button');btn.textContent='CONFIRM TOTAL PURGE';btn.className='danger';btn.onclick=()=>{if(confirm('FINAL WARNING: erase ALL Solo System data on this device?')){S=fresh();save();tab='dashboard';render();root.innerHTML='';systemAlert('SYSTEM PURGED','All local player data has been erased. The record begins again.','LEVEL 1 · ARISE');}};document.querySelector('.sys-alert .alert-actions')?.appendChild(btn)},50)};
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}load();checkDeadline();render();setInterval(()=>{let t=document.querySelector('#daily-timer');if(t)t.textContent=clockText()},1000);setInterval(()=>{let before=S.penalty&&S.penalty.date;checkDeadline();if((S.penalty&&S.penalty.date)!==before)render()},30000);if(!sessionStorage.getItem('solo-system-intro-shown')){sessionStorage.setItem('solo-system-intro-shown','1');setTimeout(()=>systemAlert('ARISE, PLAYER','System interface online. Your first-page attributes are ready. Complete real-life quests, claim XP, and allocate stat points as you level up.' ,'AWAKENING PROTOCOL: ACTIVE'),450)}
setTimeout(()=>triggerThunder(false),250);
</script>
